<mat-card>
  <mat-card-title>Inicio de Sesión</mat-card-title>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email" placeholder="usuario@correo.com" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" placeholder="Ingrese su contraseña" />
      </mat-form-field>

      <button mat-raised-button color= "primary" type="submit" class="full-width">
        Ingresar
      </button>
    </form>
  </mat-card-content>
</mat-card>
